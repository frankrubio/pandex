name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Librerías de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      # En Linux las pruebas corren en español, como en la PC de quien usa Pandex: Qt adopta el
      # idioma del sistema y así sale cualquier prueba que dependa del inglés.
      - name: Idioma español (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen es_PE.UTF-8
          echo "LANG=es_PE.UTF-8" >> "$GITHUB_ENV"
      - name: Dependencias
        run: python -m pip install -r requirements.txt -r requirements-markdown.txt
      - name: Pruebas (sin internet, ventanas invisibles)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
